plugins { id 'com.android.application' }
// Cloud configuration is distributed privately by the project lead.
if (file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }
android {
    namespace 'com.example.um_foodloop'
    compileSdk 37
    defaultConfig {
        applicationId 'com.example.um_foodloop'
        minSdk 24
        targetSdk 37
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true; viewBinding true; resValues true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    flavorDimensions += 'backend'
    productFlavors {
        local {
            dimension 'backend'
            applicationIdSuffix '.local'
            buildConfigField 'boolean', 'USE_EMULATORS', 'true'
            resValue 'string', 'app_name', 'EcoCommute Local'
        }
        cloud {
            dimension 'backend'
            buildConfigField 'boolean', 'USE_EMULATORS', 'false'
            resValue 'string', 'app_name', 'UM EcoCommute'
        }
    }
    testOptions { animationsDisabled true }
}
androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant ->
        if (variant.productFlavors.any { it.second == 'local' }) variant.enable = false
    }
}
// Local variants must never consume the cloud config (package suffix differs).
tasks.configureEach {
    if (name.startsWith('processLocal') && name.endsWith('GoogleServices')) enabled = false
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
