name: Android emulator navigation smoke test

on:
  push:
    paths:
      - '.github/workflows/android-smoke.yml'
      - 'android/**'
      - 'integration_test/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Verify static and widget tests
        run: |
          flutter pub get
          flutter analyze
          flutter test test/app_test.dart
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify navigation on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: flutter test integration_test/navigation_test.dart -d emulator-5554
      - name: Upload verified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: foodloop-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
