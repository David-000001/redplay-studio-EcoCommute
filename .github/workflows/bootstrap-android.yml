name: Bootstrap Android and verify navigation

on:
  push:
    paths:
      - '.github/workflows/bootstrap-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate and validate Android project
        run: |
          flutter --version
          flutter create . --platforms=android --project-name um_foodloop
          rm -f test/widget_test.dart
          flutter pub get
          flutter analyze
          flutter test test/app_test.dart

      - name: Commit generated Android platform files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/ .metadata
          if ! git diff --cached --quiet; then
            git commit -m 'build(android): generate Flutter Android platform project'
            git push origin HEAD:main
          else
            echo 'Android project is already present'
          fi

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Allow Android emulator KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real Android emulator navigation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: flutter test integration_test/navigation_test.dart -d emulator-5554

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: foodloop-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
