name: Auth Android debug build
on:
  pull_request:
    paths: ['lib/**', 'test/**', 'integration_test/**', 'pubspec.*', 'android/**', 'security/**', 'firebase.json', 'firestore.rules', '.github/workflows/auth-android.yml']
  push:
    branches: [main]
    paths: ['lib/**', 'test/**', 'integration_test/**', 'pubspec.*', 'android/**', 'security/**', 'firebase.json', 'firestore.rules', '.github/workflows/auth-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Verify Flutter and build
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --debug
      - name: Install local Firebase test tools
        run: npm install --prefix security --no-audit --no-fund
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android navigation and Firebase repository
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            flutter test integration_test/navigation_test.dart -d emulator-5554
            ./security/node_modules/.bin/firebase emulators:exec --project demo-foodloop-auth --only auth,firestore "node security/seed-emulators.cjs && flutter test integration_test/auth_emulator_test.dart -d emulator-5554 --dart-define=USE_FIREBASE_EMULATORS=true"
      - name: Archive development APK
        uses: actions/upload-artifact@v4
        with:
          name: foodloop-local-development-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
