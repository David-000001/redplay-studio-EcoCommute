name: Auth Android debug build
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/auth-android.yml'
  push:
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/auth-android.yml'

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Verify Flutter dependencies and static tests
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build Android debug app with Firebase plugin dependencies
        run: flutter build apk --debug
      - name: Archive Android debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: foodloop-auth-scaffold-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 5
