name: Native Android Java checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and lint
        run: |
          chmod +x android/gradlew
          android/gradlew -p android :app:assembleLocalDebug :app:assembleCloudDebug :app:testLocalDebugUnitTest :app:lintLocalDebug :app:lintCloudDebug
      - name: Install Firebase test tools
        run: npm install --prefix security --no-audit --no-fund
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Java repository and XML screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./security/node_modules/.bin/firebase emulators:exec --project demo-foodloop-auth --only auth,firestore "node security/seed-emulators.cjs && android/gradlew -p android :app:connectedLocalDebugAndroidTest"
      - name: Archive development APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foodloop-native-local-development
          path: |
            android/app/build/outputs/apk/local/debug/*.apk
            android/app/build/reports/
          retention-days: 14

